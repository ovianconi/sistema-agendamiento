# ===========================================
# ⚙️  CONFIGURACIÓN GENERAL - PERFIL PROD
# ===========================================
# spring.profiles.active=prod
server.port=${SERVER_PORT}

# ===========================================
# 🗄️  BASE DE DATOS - PostgreSQL (AWS RDS)
# ===========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================================
# 🤖  INTEGRACIONES EXTERNAS (WHATSAPP + OPENAI)
# ===========================================
openai.api-key=${OPENAI_API_KEY}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN}
app.api.prefix=/api

# ===========================================
# 🌐  CONFIGURACIÓN DE ENTORNO / URL BASE
# =========================================== sgacer.us-east-2.elasticbeanstalk.com
app.base-url=${APP_BASE_URL}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}

# ===========================================
# 🛡️  JWT / SEGURIDAD
# ===========================================
jwt.secret=${JWT_SECRET:jwt_default_secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===========================================
# 🔧  LOGGING (nivel controlado)
# ===========================================
logging.level.root=INFO
logging.level.com.estetica.agendamiento=INFO
